    <!-- Primary Meta — description, canonical & OG url/title/description/image
         are set per-route via react-helmet (SEOHead). Do not hardcode them here
         or the prerendered pages emit duplicate (homepage) tags. -->
    <meta name="author" content="Desire Realty" />
    <meta name="keywords" content="plots in Jaipur, flats in Jaipur, RERA developer Jaipur, Vaishali Nagar plots, Jagatpura apartments, Chaksu NH-8 plots, 200 FT Road Jaipur" />

    <!-- Mobile optimizations -->
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) — url/title/description/image set per-route by SEOHead -->
    <meta property="og:type" content="website" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Desire Realty — Jaipur Real Estate Developer" />

    <meta property="og:site_name" content="Desire Realty" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
